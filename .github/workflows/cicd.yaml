name: cicd Pipeline

on:
  push:
    branches: [ "feature/cicd" ] 

jobs:
  compile:
    runs-on: Agent-1

    steps:
    - name: checkout
      uses: actions/checkout@v4 
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Give permission to mvnw
      run: chmod +x mvnw
      
    - name: Build with Maven
      run: ./mvnw compile

  security-check:
    runs-on: Agent-1
    needs: compile
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Trivy installation 
      run: |
        sudo apt-get install wget gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install trivy -y 
        
    - name: Trivy fs scan
      run: trivy fs --format table -o fs-report.json . 

    - name: gitleaks-installation
      run: sudo apt install gitleaks -y 

    - name: gitleaks-scan
      run: gitleaks detect -- source .  -r gitleaks-report.json -f json
      
  test:
    runs-on: Agent-1
    needs: security-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: give permission to mvnw 
      run: chmod +x mvnw

    - name: unit test Cases
      run: ./mvnw test

  Build_Sonar_Scan:
    runs-on: Agent-1
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: give permission to mvnw 
      run: chmod +x mvnw

    - name: Build project
      run: ./mvnw package

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*jar
      

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Check the Quality Gate status.
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
        pollingTimeoutSec: 600
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} #OPTIONAL

  build_docker_image:
    runs-on: Agent-1
    needs: Build_Sonar_Scan
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: yash/bankapp:latest
    

   
    

      

      
     
      

      
          
      
      
    
      
      
    

  
